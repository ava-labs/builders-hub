name: Blueprints CI

on:
  pull_request:
    branches:
      - master
    paths:
      - 'blueprints/**'
      - 'lib/blueprints/**'
      - 'lib/studio/**'
      - 'lib/verification/solc.ts'
      - 'scripts/blueprints/**'
      - 'scripts/studio/**'
      - 'tests/unit/blueprints/**'
      - 'tests/unit/studio/**'
      - 'contracts/icm-contracts/compiled/**'
      - '.github/workflows/blueprints-ci.yml'

concurrency:
  group: blueprints-ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    name: Test and audit blueprints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1

      - name: Solidity dependencies (pinned, checksum-verified)
        run: yarn blueprints:deps

      - name: Blueprint validation and Studio unit tests
        run: npx vitest run tests/unit/blueprints tests/unit/studio

      - name: Foundry tests (1024 fuzz runs)
        working-directory: blueprints
        env:
          FOUNDRY_PROFILE: ci
        run: forge test

      - name: Audit gate
        run: yarn blueprints:audit

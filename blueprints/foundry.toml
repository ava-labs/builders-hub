# Foundry suite for the blueprint reference contracts. Every .sol under blueprints/ compiles here, and each
# blueprint's tests live in <id>/test/. Dependencies are fetched into ../.blueprint-deps by
# scripts/blueprints/setup-test-deps.sh at the exact versions pinned in _shared/compiler.json.
[profile.default]
src = "."
test = "."
out = "../.blueprint-deps/out"
cache_path = "../.blueprint-deps/cache"
libs = ["../.blueprint-deps"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 32, fail_on_revert = false }
allow_paths = ["../.blueprint-deps", "../contracts"]
fs_permissions = [{ access = "read", path = "../contracts/icm-contracts/compiled" }]
remappings = [
  "forge-std/=../.blueprint-deps/forge-std/src/",
  "@openzeppelin/contracts@5.3.0/=../.blueprint-deps/@openzeppelin/contracts/",
  "@openzeppelin/contracts/=../.blueprint-deps/@openzeppelin/contracts/",
  "@chainlink/contracts-ccip/=../.blueprint-deps/@chainlink/contracts-ccip/",
  "@teleporter/=_shared/contracts/teleporter/",
  "@blueprints-test/=_shared/test/",
]

# Naming lints conflict with ecosystem conventions the contracts follow, e.g. ICTT's blockchainID fields.
[lint]
exclude_lints = ["mixed-case-variable", "mixed-case-function", "screaming-snake-case-immutable"]

[profile.ci]
fuzz = { runs = 1024 }
invariant = { runs = 128, depth = 64, fail_on_revert = false }

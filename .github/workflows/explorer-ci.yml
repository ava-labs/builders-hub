name: Explorer CI

# Any PR that touches the explorer, stacked PRs included. The paths are EXPLORER in eslint.config.mjs, and the
# files that hold the explorer's rules. The explorer unit tests run with the whole Vitest suite in unit.yml.
on:
  pull_request:
    paths:
      - 'components/explorer-v2/**'
      - 'components/explorer/**'
      - 'lib/explorer-query/**'
      - 'lib/explorer-clickhouse.ts'
      - 'lib/pchain-explorer.ts'
      - 'app/(home)/explorer/**'
      - 'app/api/explorer/**'
      - 'eslint.config.mjs'
      - 'scripts/explorer-size-ceilings.json'
      - '.github/workflows/explorer-ci.yml'

concurrency:
  group: explorer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      # unused code, one home for each shared helper, and no file past its size ceiling (eslint.config.mjs)
      - name: ESLint (explorer)
        run: npx eslint --max-warnings 0 components/explorer-v2 components/explorer lib/explorer-query lib/explorer-clickhouse.ts lib/pchain-explorer.ts "app/(home)/explorer" app/api/explorer

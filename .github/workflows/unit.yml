name: Unit tests

# The whole Vitest suite (tests/unit and the test files beside the code) on every PR, stacked PRs included, and on
# every push to master. It needs no secrets and no network, so it runs on fork PRs too. The master runs also save a
# yarn cache that a new PR can restore.

on:
  pull_request:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: unit-${{ github.ref }}
  # A newer push to a PR replaces its run. Each master commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest:
    permissions:
      contents: read
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: true  # kept: job runs git commands that use the checkout token

      # tests/unit/explorer/size-ceilings.test.ts compares the explorer size ceilings with master's.
      - name: Fetch master
        run: git fetch --no-tags --depth=1 origin +refs/heads/master:refs/remotes/origin/master

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'yarn'

      # The postinstall generates the Prisma client. 21 test files load it for its types and enums.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Vitest
        run: npx vitest run

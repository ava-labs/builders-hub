# Dead-link check for the external links in content/ (.github/workflows/link-check.yml).
# Internal links are covered by the e2e route sweep. Root-relative links (/docs/...) resolve against the site
# and are then excluded below, so only external http(s) links are checked.
base_url = "https://build.avax.network"
scheme = ["https", "http"]
exclude_loopback = true
exclude_private = true

# 403 and 429 are bot blocks and rate limits, not dead pages.
accept = ["200..=299", "403", "429"]

max_concurrency = 32
max_retries = 2
timeout = 20
max_redirects = 10
no_progress = true

exclude = [
  # Internal links
  '^https://build\.avax\.network',
  # Sites that block or log-wall bots
  '^https?://(www\.)?(x|twitter|linkedin)\.com',
  # Cookie wall for bots
  '^https://www\.vaneck\.com',
  # Login redirect
  '^https://account\.microsoft\.com/',
  # The docs need a login (401)
  '^https://docs\.cubist\.dev',
  # Host refuses or times out from CI
  '^https://crypto\.stanford\.edu/',
  # The demo link holds its whole state in a 3489-character path, which returns 400 to HEAD and GET
  '^https://sandbox\.eth\.build/',
  # RPC and API endpoints: they answer POST, not GET
  '^https://api\.avax(-test)?\.network/ext/',
  # Placeholders in examples
  '^https?://nodeipaddress',
  '[<{]',
  '^https?://(www\.)?example\.(com|org)',
  # Archived snapshots are immutable and the archive refuses bursts
  '^https://web\.archive\.org/',
]

# A GitHub blob page can answer 503 under load. The raw file of the same path answers 200 or 404, so check that.
# Only a path that ends in a file extension is remapped: a folder has no raw file.
remap = [
  '^https://github\.com/([^/]+)/([^/]+)/blob/([^#?]+/[^/#?]+\.[A-Za-z0-9]+(#.*)?)$ https://raw.githubusercontent.com/$1/$2/$3',
]

# GitHub answers a burst with 429, and `accept` passes 429, so a dead GitHub link could pass on a busy night.
# Two requests at a time, 500 ms apart, stay under the rate limit.
[hosts."github.com"]
concurrency = 2
request_interval = "500ms"

[hosts."raw.githubusercontent.com"]
concurrency = 2
request_interval = "500ms"
